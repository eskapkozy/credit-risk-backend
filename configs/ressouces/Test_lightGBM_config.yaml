run:
  name: "lightgbm Test"
  version: 1
  random_state: 42
  is_train: false

# Model
model:
  name: "lightgbm"
  hyperparameters:

    regularisation:

      # profondeur max
      max_depth: 4

      # équivalent approximatif de min_child_weight
      min_child_samples: 20

      # L2
      reg_lambda: 1.0

      # L1
      reg_alpha: 0.1

      # row sampling
      subsample: 0.8
      # feature sampling
      colsample_bytree: 0.8
      learning_rate: 0.1
      # IMPORTANT dans LightGBM
      num_leaves: 15
    n_estimators: 1000
    early_stopping_rounds: 10
    scale_pos_weight: 1
    metric: "binary_logloss"






# Component

woe:
  enabled: true
  iv_threshold: 0.02
  metric: "woe"
  persistence: false



smote:
  enabled: true
  sampling_strategy: "auto"
  random_state: 42

correlation:
  enabled: true
  threshold: 0.8

# Evaluation & Metrics

evaluation:
  roc_auc: true
  recall: true
  precision: true
  f1_score: true
  confusion_matrix: true

  threshold: 0.14999999999999997
  # contrainte
  recall_threshold: 0.905
  precision_threshold: 0.43493975903614457
  f1_threshold: 0.5869918699186992



# stack Used

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "classification"

  # Artifact path
  run_artifact_path:

    run_id:  "4e17ffa861d6471085436c168f501288"
    binning_process:
      name: "binning_process"
      path: "binning_process"
      artifact_type: "PKL"
      ismodel: false

    model_fit:
      name: "model_fit"
      path: "model_fit"
      artifact_type: "PKL"
      ismodel: false







# Livrable ( Artifacts , Reports , Plot )

artifacts:
  log_model: true
  log_woe: true
  log_reports: true