run:
  name: "Logistique Regression Test"
  version: 1
  random_state: 42
  is_train: false

# Model
model:
  name: "logistic_regression"
  hyperparameters:
    regularisation:
      C: 1.0
      penalty: "l2"
      tol: 0.0001
      random_state: 42
    max_iter: 1000
    solver: "lbfgs"
    class_weight: "balanced"




# Component

woe:
  enabled: true
  iv_threshold: 0.02
  metric: "woe"
  persistence: false



smote:
  enabled: true
  sampling_strategy: "auto"
  random_state: 42

correlation:
  enabled: true
  threshold: 0.8

# Evaluation & Metrics

evaluation:
  roc_auc: true
  recall: true
  precision: true
  f1_score: true
  confusion_matrix: true
  # on considere en deffaut un seuil de 26% ( methode prudente )
  threshold: 0.2699999999999999
  # contrainte
  recall_threshold: 0.9025
  precision_threshold: 0.3928182807399347
  f1_threshold: 0.5473843821076573


# stack Used

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "classification"

  # Artifact path
  run_artifact_path:

    run_id: "802e3adb80994db584fb17d8ec0eeb77"
    binning_process:
      name: "binning_process"
      path: "binning_process"
      artifact_type: "PKL"
      ismodel: false

    model_fit:
      name: "model_fit"
      path: "model_fit"
      artifact_type: "PKL"
      ismodel: false




# Livrable ( Artifacts , Reports , Plot )

artifacts:
  log_model: true
  log_woe: true
  log_reports: true